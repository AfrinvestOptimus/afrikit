name: Publish npm Packages

on:
  push:
    branches:
      - main
  # Lets a failed release be re-run without an empty commit.
  workflow_dispatch:

# Two releases racing would both try to tag and push to main.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 because `lerna version --conventional-commits` reads the
      # commit history and existing tags to decide the next version. A shallow
      # clone has neither, so it cannot bump correctly.
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      - name: Configure npm to use the token
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # Fail before anything is versioned if the token is missing, expired or
      # lacks publish rights. Without this, `lerna version` bumps and pushes
      # first, then `lerna publish` fails -- leaving main claiming a release
      # that never reached npm. That is exactly how 1.1.0 through 1.1.3 ended up
      # tagged here while npm still served 1.0.120.
      - name: Verify the npm token can publish
        run: |
          if ! whoami_out=$(npm whoami --registry=https://registry.npmjs.org 2>&1); then
            echo "::error::NPM_TOKEN is invalid or expired. npm whoami said: $whoami_out"
            echo "::error::Rotate the token at npmjs.com and update the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "Authenticated to npm as $whoami_out"

          # Derived from lerna rather than hardcoded, so this stays correct if
          # another package is promoted into the workspace later. Today it is
          # afrikit-mobile only -- afrikit-shared lives in shared/, which is
          # outside lerna's `packages` globs, so the release never touches it.
          for pkg in $(npx lerna list --json --no-private | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).map(p=>p.name).join(' ')"); do
            if ! npm access list collaborators "$pkg" >/dev/null 2>&1; then
              echo "::error::$whoami_out cannot publish $pkg. The token needs write access to it."
              exit 1
            fi
            echo "Token has publish rights on $pkg"
          done

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Build project
        run: yarn build

      - name: Publish packages with Lerna
        run: |
          git config --global user.email "developers@afrinvest.com"
          git config --global user.name "Afrinvest"
          git checkout main
          npx lerna version --conventional-commits --yes --no-private
          npx lerna publish from-package --yes --no-private
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # `lerna publish` has warned-and-continued on a per-package failure
      # before, so confirm from the registry's side that what the repo now
      # claims is actually downloadable.
      - name: Verify the published versions are live on npm
        run: |
          failed=0
          npx lerna list --json --no-private > /tmp/lerna-packages.json
          count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8')).length")
          for i in $(seq 0 $((count - 1))); do
            pkg=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8'))[$i].name")
            expected=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8'))[$i].version")
            published=$(npm view "$pkg" version 2>/dev/null || echo 'none')
            if [ "$expected" = "$published" ]; then
              echo "$pkg@$expected is live on npm"
            else
              echo "::error::$pkg: this release produced $expected but npm serves $published."
              failed=1
            fi
          done
          exit $failed
