name: Publish npm Packages

on:
  push:
    branches:
      - main
  # Lets a failed release be re-run without an empty commit.
  workflow_dispatch:

# Two releases racing would both try to tag and push to main.
concurrency:
  group: publish-npm
  cancel-in-progress: false

# id-token: npm trusted publishing (OIDC). No NPM_TOKEN to expire.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 because `lerna version --conventional-commits` reads the
      # commit history and existing tags to decide the next version. A shallow
      # clone has neither, so it cannot bump correctly.
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: yarn

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Build project
        run: yarn build

      # Commit and tag locally only. Nothing reaches main until npm has the
      # release, so a failed publish can no longer leave tags for versions npm
      # never got (how 1.0.121 and 1.1.3 ended up tagged while npm served 1.0.120).
      - name: Version packages
        run: |
          git config --global user.email "developers@afrinvest.com"
          git config --global user.name "Afrinvest"
          git checkout main
          npx lerna version --conventional-commits --yes --no-private --no-push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # npm CLI rather than `lerna publish`: lerna 8 predates trusted publishing.
      # Skips versions npm already has, so a re-run after a failed push is safe.
      - name: Publish to npm
        run: |
          npx lerna list --json --no-private | jq -r '.[] | [.name, .version, .location] | @tsv' > "$RUNNER_TEMP/packages.tsv"
          while IFS=$'\t' read -r name version location; do
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "$location" && npm publish < /dev/null)
          done < "$RUNNER_TEMP/packages.tsv"

      - name: Push release commit and tags
        run: git push --follow-tags --no-verify --atomic origin main

      # Confirm from the registry's side that what the repo now claims is
      # actually downloadable.
      - name: Verify the published versions are live on npm
        run: |
          failed=0
          npx lerna list --json --no-private > /tmp/lerna-packages.json
          count=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8')).length")
          for i in $(seq 0 $((count - 1))); do
            pkg=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8'))[$i].name")
            expected=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/lerna-packages.json','utf8'))[$i].version")
            published=$(npm view "$pkg" version 2>/dev/null || echo 'none')
            if [ "$expected" = "$published" ]; then
              echo "$pkg@$expected is live on npm"
            else
              echo "::error::$pkg: this release produced $expected but npm serves $published."
              failed=1
            fi
          done
          exit $failed
