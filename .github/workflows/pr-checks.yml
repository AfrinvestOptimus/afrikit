name: PR Checks

on:
  pull_request:
    branches:
      - main
      - 'release/*'
  # Lets the checks be run on demand, including on a branch that does not
  # target main yet.
  workflow_dispatch:

# A newer push to the same PR makes the in-flight run redundant.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs write access; the repo default may be read/write.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      # --frozen-lockfile so a PR cannot silently resolve different versions
      # than the lockfile records. This installs from a clean tree: the build
      # breakages this workflow exists to catch were invisible locally,
      # because existing checkouts carried a stale node_modules.
      - name: Install
        run: yarn install --frozen-lockfile

      # Must run before the lint/typecheck/build steps below. afrikit-shared is a
      # workspace now rather than a registry download, so its dist/ does not
      # exist until it is compiled -- and packages/mobile imports
      # `afrikit-shared/dist/colors` for types and requires `afrikit-shared/dist`
      # in its tailwind config. It was outside the workspace until now and
      # nothing ever compiled it in CI; `yarn build` in shared/ exited 127 for
      # want of a local typescript.
      - name: Build shared tokens
        working-directory: shared
        run: |
          yarn build
          test -f dist/index.js \
            || { echo "::error::shared/dist/index.js is missing; the published tarball would be empty."; exit 1; }
          test -f dist/index.d.ts \
            || { echo "::error::shared/dist/index.d.ts is missing; consumers would get no token types."; exit 1; }

      - name: Lint
        run: yarn lint

      - name: Typecheck library
        working-directory: packages/mobile
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck Storybook harness
        working-directory: packages/storybook
        run: npx tsc --noEmit


      - name: Build library
        working-directory: packages/mobile
        run: yarn build

      # afrikit-mobile shipped with zero type declarations for an unknown
      # period, because tsconfig extended a base that sets noEmit. Consumers
      # silently fell back to implicit `any`. A build that emits only
      # JavaScript is a failed build.
      - name: Assert type declarations were emitted
        working-directory: packages/mobile
        run: |
          test -f dist/index.d.ts \
            || { echo "::error::dist/index.d.ts is missing. Consumers would get no types."; exit 1; }
          # Secondary sanity check: the build currently emits 46 .d.ts files, so
          # a sharp drop means whole directories stopped emitting declarations.
          count=$(find dist -name '*.d.ts' | wc -l)
          echo "Found $count .d.ts files"
          if [ "$count" -lt 20 ]; then
            echo "::error::Build emitted only $count .d.ts files; expected roughly 46."
            exit 1
          fi

      - name: Assert the harness is not shipped to consumers
        working-directory: packages/mobile
        run: |
          for leaked in dist/App.js dist/.storybook; do
            if [ -e "$leaked" ]; then
              echo "::error::$leaked is in the published build output."
              exit 1
            fi
          done

  package:
    name: Package smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Build and pack
        run: |
          yarn workspace afrikit-shared build
          (cd shared && npm pack --silent)
          (cd packages/mobile && yarn build && npm pack --silent)

      # Installing the tarball the way a consumer does is the only check that
      # exercises `main`, the `files` whitelist and the emitted types together.
      # `main` once pointed at a file `files` never published, so the installed
      # package was empty; nothing in the repo could have caught that.
      - name: Install the tarball into a scratch project
        run: |
          tarball=$(ls packages/mobile/afrikit-mobile-*.tgz)
          shared_tarball=$(ls shared/afrikit-shared-*.tgz)
          echo "Testing $tarball against $shared_tarball"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          # --legacy-peer-deps because afrikit-mobile declares open-ended peers
          # (react-native-reanimated: *, tailwindcss: *). npm 7+ would
          # auto-install the latest of each, which conflicts with the pinned
          # react-native below and makes the result depend on what upstream
          # published that day. This check only needs the package's own
          # declarations plus react-native for the types it imports, and
          # check.ts uses skipLibCheck.
          # Both tarballs together. afrikit-mobile depends on the afrikit-shared
          # version built in this same run, which is by definition not on the
          # registry yet, so resolving it from npm would fail with ETARGET. A
          # release publishes the two in dependency order for the same reason.
          npm install --no-audit --no-fund --legacy-peer-deps \
            "$GITHUB_WORKSPACE/$shared_tarball" \
            "$GITHUB_WORKSPACE/$tarball" \
            react@18.2.0 react-native@0.74.5 typescript@~5.3.3

      - name: Assert the installed package resolves and has types
        run: |
          cd "$RUNNER_TEMP/consumer"
          main=$(node -p "require('afrikit-mobile/package.json').main")
          test -f "node_modules/afrikit-mobile/$main" \
            || { echo "::error::main ($main) is missing from the published package."; exit 1; }
          types=$(node -p "require('afrikit-mobile/package.json').types")
          test -f "node_modules/afrikit-mobile/$types" \
            || { echo "::error::types ($types) is missing from the published package."; exit 1; }
          echo "main and types both present"

      # Resolving the type declarations is the part that regressed before, so
      # assert on it directly rather than on a full React Native typecheck,
      # which would need the whole peer stack installed.
      - name: Typecheck an import of the package
        run: |
          cd "$RUNNER_TEMP/consumer"
          cat > check.ts <<'TS'
          import type { AppButtonProps, AppBottomSheetProps } from 'afrikit-mobile'

          const button: Pick<AppButtonProps, 'text'> = { text: 'ok' }
          type SheetIndex = AppBottomSheetProps<false>['index']

          export { button }
          export type { SheetIndex }
          TS
          cat > tsconfig.json <<'JSON'
          {
            "compilerOptions": {
              "strict": true,
              "noEmit": true,
              "jsx": "react-jsx",
              "moduleResolution": "node",
              "esModuleInterop": true,
              "skipLibCheck": true,
              "types": []
            },
            "files": ["check.ts"]
          }
          JSON
          npx tsc -p tsconfig.json

      # afrikit-shared ships the design tokens that consumers import directly
      # (`afrikit-shared/dist/colors`). The registry served 1.0.33 while the
      # repo said 1.0.18, so nothing here had ever verified its tarball.
      - name: Install the shared tarball and read a token through it
        run: |
          tarball=$(ls shared/afrikit-shared-*.tgz)
          echo "Testing $tarball"
          mkdir -p "$RUNNER_TEMP/shared-consumer" && cd "$RUNNER_TEMP/shared-consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          main=$(node -p "require('afrikit-shared/package.json').main")
          test -f "node_modules/afrikit-shared/$main" \
            || { echo "::error::main ($main) is missing from the published package."; exit 1; }
          node -e "
            const c = require('afrikit-shared/dist')
            const accent = c.default.theme.colors.light.accent9
            if (!accent) { console.error('::error::colors.light.accent9 did not survive packing'); process.exit(1) }
            console.log('afrikit-shared resolves; colors.light.accent9 =', accent)
          "
